<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Amore Mio | Beauty Spa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo-nav">Amore Mio</div>
        <div class="menu">
            <a href="javascript:void(0)" onclick="navegar('home')">Home</a>
            <a href="javascript:void(0)" onclick="navegar('nosotros')">Nosotros</a>
            <a href="javascript:void(0)" onclick="navegar('servicios')">Servicios</a>
            <a href="javascript:void(0)" onclick="navegar('contacto')">Contacto</a>
        </div>
        <a class="btn-nav" href="https://wa.me/5215594292811">Reservar</a>
    </nav>

    <div id="hoja-home" class="hoja activa">
        <section class="hero">
            <div class="hero-content">
                <div class="logo-wrapper">
                    <img src="logo.png" alt="Amore Mio Logo" class="main-logo">
                </div>
                
                <h1>Tu belleza, elevada al siguiente nivel</h1>
                <p>Experiencias únicas para cuerpo y mente</p>
                
                <button class="btn-principal" onclick="navegar('servicios')">Explorar Servicios</button>
            </div>
        </section>
    </div>

    <div id="hoja-nosotros" class="hoja"></div>
    <div id="hoja-servicios" class="hoja"></div>
    <div id="hoja-contacto" class="hoja"></div>

    <script>
        // Función para cambiar de "Hoja" como en Excel
        function navegar(idHoja) {
            // 1. Ocultar todas las hojas
            const hojas = document.querySelectorAll('.hoja');
            hojas.forEach(hoja => {
                hoja.classList.remove('activa');
            });

            // 2. Mostrar solo la hoja seleccionada
            const destino = document.getElementById('hoja-' + idHoja);
            if (destino) {
                destino.classList.add('activa');
            }

            // 3. Subir al inicio de la página automáticamente
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
